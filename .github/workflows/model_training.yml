name: Train Model
on: 
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4


    - name: Install uv
      uses: astral-sh/setup-uv@v6
    
    - name: Sync Python dependencies
      run: |
        uv sync --locked

    - name: Train model
      run: |
        mkdir output
        uv run src/read_data.py
        uv run src/text_preprocessing.py
        uv run src/text_classification.py
    
    - name: Compres training output
      run: |
        zip -r output.zip output
    
    - name: Publish model
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        ID=$(sha256sum output.zip | cut -c1-10)
        VERS=$(uv version --short)
        RELEASE_NAME="model-${VERS}-${ID}"

        gh release create $RELEASE_NAME --title $RELEASE_NAME --notes "Automated model release for version $VERS"
        gh release upload $RELEASE_NAME output.zip